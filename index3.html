<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, pricing!</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 32px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
      color: #1f2937;
      background: #f5f7fa;
    }

    main {
      max-width: 960px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    .author {
      margin: 0;
      color: #6b7280;
    }

    .plans {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .plan {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 24px;
    }

    .plan.featured {
      border: 2px solid #2563eb;
    }

    .plan h2 {
      margin: 0 0 8px;
      font-size: 1.25rem;
    }

    .price {
      margin: 0 0 16px;
      font-size: 2rem;
      font-weight: 700;
    }

    .price span {
      font-size: 1rem;
      font-weight: 400;
      color: #6b7280;
    }

    .plan ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .plan li {
      padding: 8px 0;
      border-top: 1px solid #f0f1f3;
    }

    .plan li::before {
      content: "✓ ";
      color: #16a34a;
      font-weight: 700;
    }

    @media (min-width: 720px) {
      .plans {
        grid-template-columns: repeat(3, 1fr);
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Hello, pricing!</h1>
      <p class="author">by Ayoub</p>
    </header>

    <section class="plans" aria-label="Pricing plans for NoteNest">
      <article class="plan">
        <h2>Free</h2>
        <p class="price">€0 <span>/ month</span></p>
        <ul>
          <li>Up to 50 notes</li>
          <li>Sync on 1 device</li>
          <li>Basic search</li>
        </ul>
      </article>

      <article class="plan featured">
        <h2>Basic</h2>
        <p class="price">€5 <span>/ month</span></p>
        <ul>
          <li>Unlimited notes</li>
          <li>Sync on 3 devices</li>
          <li>Email support</li>
        </ul>
      </article>

      <article class="plan">
        <h2>Pro</h2>
        <p class="price">€12 <span>/ month</span></p>
        <ul>
          <li>Everything in Basic</li>
          <li>Unlimited devices</li>
          <li>Priority support</li>
        </ul>
      </article>
    </section>
  </main>
</body>
</html>
